name: Build Open-WebUI IPA

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner'
        required: false
        default: 'macos-26'

jobs:
  ipa:
    runs-on: ${{ github.event.inputs.runner || 'macos-26' }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: 选最新 Xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          [ -n "$NEWEST" ] && sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 预解析依赖
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "Open UI.xcodeproj" \
            -scheme "Open UI" \
            -skipPackagePluginValidation \
            -skipMacroValidation 2>&1 | tail -20

      - name: 编译（串行，避免插件产物竞态）
        run: |
          set -o pipefail
          # 关键点：
          # -jobs 1             : SwiftTerm 的构建信息插件需要一个先生成的可执行文件，
          #                       并行构建时会被抢跑导致 "Build input file cannot be found"
          # -skipPackagePluginValidation / -skipMacroValidation : 未签名构建放行插件
          xcodebuild build \
            -project "Open UI.xcodeproj" \
            -scheme "Open UI" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -jobs 1 \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            2>&1 | tee build.log | tail -n 70

      - name: 打包 IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP" || { echo "没有 .app"; find build/Build/Products -name '*.app' | head; exit 1; }
          echo "app: $APP"
          rm -rf Payload OpenRelay-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry OpenRelay-unsigned.ipa Payload
          ls -lh OpenRelay-unsigned.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" || true

      - name: 上传 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenRelay-ipa
          path: OpenRelay-unsigned.ipa
          retention-days: 7

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
