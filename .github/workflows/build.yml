name: Build Open-WebUI IPA

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner'
        required: false
        default: 'macos-26'

jobs:
  ipa:
    runs-on: ${{ github.event.inputs.runner || 'macos-26' }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: 选最新 Xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          [ -n "$NEWEST" ] && sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 只保留 iOS 目标（移除 Watch 依赖）
        run: |
          sed -i 's/OpenRelayWatch.*= {isa = PBXBuildFile.*};//' "/tmp/nonexistent" 2>/dev/null || true
          echo "== 当前 scheme 的构建目标 =="
          xcodebuild -list -project "Open UI.xcodeproj" 2>&1 | head -40

      - name: 编译（只要 iPhone App，不签名）
        run: |
          set -o pipefail
          # 只构建 app target，避免 watchOS 扩展参与
          # -skipPackagePluginValidation: mlx-swift CudaBuild / swiftterm 插件
          # ENABLE_USER_SCRIPT_SANDBOXING=NO: 配合插件放行
          xcodebuild build \
            -project "Open UI.xcodeproj" \
            -target "Open UI" \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$(pwd)/out" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=YES \
            SKIP_INSTALL=NO \
            2>&1 | tee build.log | tail -n 70

      - name: 打包 IPA
        run: |
          APP=$(find out -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP" || { echo "没有 .app"; find . -name '*.app' -not -path './build/*' | head; exit 1; }
          echo "app: $APP"
          rm -rf Payload OpenRelay-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry OpenRelay-unsigned.ipa Payload
          ls -lh OpenRelay-unsigned.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" || true

      - name: 上传 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenRelay-ipa
          path: OpenRelay-unsigned.ipa
          retention-days: 7

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
